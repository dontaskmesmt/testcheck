name: Test

on:
  push:
    branches: [ source ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Run test
      run: node test.js
    
    - name: Push to main
      if: success()
      run: |
        git config user.name 'github-actions'
        git config user.email 'actions@github.com'
        
        mkdir -p /tmp/clean
        rsync -av --exclude='multiply.js' --exclude='.git' ./ /tmp/clean/
        
        git checkout main
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
        cp -r /tmp/clean/* . 2>/dev/null || true
        
        git add -A
        git diff --staged --quiet || git commit -m "Update from source"
        git push origin main