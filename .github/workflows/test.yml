on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node test.js
  
  push-to-main:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          
          mkdir -p /tmp/clean
          cp test.js /tmp/clean/
          cp package.json /tmp/clean/
          cp README.md /tmp/clean/
          cp -r .github /tmp/clean/
          
          git checkout main
          rm -rf test.js package.json multiply.js README.md .github
          cp /tmp/clean/test.js .
          cp /tmp/clean/package.json .
          cp /tmp/clean/README.md .
          cp -r /tmp/clean/.github .
          
          git add test.js package.json README.md .github
          git commit -m "Update" || echo "No changes"
          git push origin main
